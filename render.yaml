services:
  - type: web
    name: syncmate-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEB_URL
        value: https://syncmate-one.vercel.app
      - key: API_URL
        value: https://syncmate-2d9o.onrender.com
      - key: CORS_ORIGINS
        value: "https://syncmate-one.vercel.app,http://localhost:5173,*"
      - key: GOOGLE_REDIRECT_URI
        value: https://syncmate-2d9o.onrender.com/api/v1/integrations/google/callback

