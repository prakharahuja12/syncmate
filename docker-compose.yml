version: '3.8'

services:
  api:
    build: .
    container_name: syncmate-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/syncmate
      - WEB_URL=http://localhost:5173
      - CORS_ORIGINS=http://localhost:5173
      - JWT_ACCESS_SECRET=production_jwt_access_secret_syncmate_minimum_32_characters_long
      - JWT_REFRESH_SECRET=production_jwt_refresh_secret_syncmate_minimum_32_characters_long
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7.0
    container_name: syncmate-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

